<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="instal_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QistPay</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Lightweight loader shown until Flutter paints the first frame */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9fc;
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid #d9e7ff;
      border-top-color: #0d8bff;
      animation: spin 1s linear infinite;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner" aria-label="Loading"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('loading');
      if (loader) loader.style.display = 'none';
    });
  </script>
  <script>
    // On each load, check version.json; if it changed, clear caches and reload.
    window.addEventListener('load', async () => {
      try {
        const res = await fetch('version.json', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const newVersion = data && data.version ? String(data.version) : null;
        if (!newVersion) return;

        const key = 'app_version';
        const currentVersion = localStorage.getItem(key);
        if (currentVersion && currentVersion !== newVersion) {
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          localStorage.setItem(key, newVersion);
          window.location.reload(true);
          return;
        }

        if (!currentVersion) {
          localStorage.setItem(key, newVersion);
        }
      } catch (e) {
        // Ignore version check failures; app can still load.
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
